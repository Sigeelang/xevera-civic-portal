# Xevera HTTPS vhost (Let's Encrypt)
# Deploy to: /etc/httpd/conf.d/xevera-ssl.conf
# Cert: /etc/letsencrypt/live/xevera-portal.duckdns.org/
# Issue: certbot certonly --webroot -w /var/www/xevera/frontend/dist \
#          -d xevera-portal.duckdns.org
# Renewal: certbot renew (webroot), reload Apache via deploy hook/cron.

<VirtualHost *:443>
    ServerName xevera-portal.duckdns.org
    ServerAlias 52.220.46.175
    DocumentRoot /var/www/xevera/frontend/dist

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/xevera-portal.duckdns.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/xevera-portal.duckdns.org/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder on

    <Directory /var/www/xevera/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On

    # 1) Pass through API and uploads
    RewriteRule ^/api/ - [L]
    RewriteRule ^/uploads/ - [L]

    # 2) Serve existing files/dirs directly
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f [OR]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
    RewriteRule ^ - [L]

    # 3) SPA fallback (handles /admin and all client routes)
    RewriteRule ^ /index.html [L]

    # Forward Authorization header to PHP-FPM
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # Backend API -> PHP-FPM
    ProxyPassMatch ^/api/(.*\.php)$ unix:/run/php-fpm/www.sock|fcgi://localhost/var/www/xevera/backend/api/$1

    Alias /api /var/www/xevera/backend/api
    <Directory /var/www/xevera/backend/api>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Static uploads. Uploaded files must never be executed as PHP.
    Alias /uploads /var/www/xevera/backend/uploads
    <Directory /var/www/xevera/backend/uploads>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RemoveHandler .php .phtml .phar .phps
        <FilesMatch "\.(php|phtml|phar|phps)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set X-Frame-Options "SAMEORIGIN"
    </IfModule>

    ErrorLog /var/log/httpd/xevera-ssl-error.log
    CustomLog /var/log/httpd/xevera-ssl-access.log combined
</VirtualHost>
