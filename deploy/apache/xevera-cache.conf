# Xevera cache policy (deploy to /etc/httpd/conf.d/xevera-cache.conf).
#
# WHY THIS EXISTS:
# Vite emits hashed assets (index-XXXX.js) but a single unhashed
# /index.html shell. Without explicit headers, browsers heuristically
# cache index.html for hours/days - so frontend deploys NEVER reach
# users (especially mobile) until they hard-refresh. Symptoms: "fix
# deployed but nothing changed on my phone".
#
# POLICY:
# - index.html        -> no-cache (revalidate every load; 304 when unchanged)
# - /assets/* (hashed, immutable) -> 1 year immutable
#
# This file is separate from xevera.conf on purpose: certbot rewrites
# the vhost blocks, and this snippet applies to all of them.

<IfModule mod_headers.c>
  # SPA shell: always revalidate, never serve stale.
  <Files "index.html">
    Header set Cache-Control "no-cache"
  </Files>

  # Hashed build assets: immutable for 1 year.
  <DirectoryMatch "^/var/www/xevera/frontend/dist/assets">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </DirectoryMatch>
</IfModule>
