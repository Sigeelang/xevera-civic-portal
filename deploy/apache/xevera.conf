# Xevera Apache vhost configuration
# Deploy to: /etc/httpd/conf.d/xevera.conf
#
# KEY LEARNINGS (do not regress):
# 1. RewriteCond only attaches to the IMMEDIATELY following RewriteRule.
#    Use first-match-wins pattern with [L] flags, not a single block.
# 2. In vhost context, %{REQUEST_FILENAME} is the URL path, not the
#    filesystem path. Use %{DOCUMENT_ROOT}%{REQUEST_URI} for file/dir checks.
# 3. Set AllowOverride None in the frontend dist Directory block to
#    prevent any .htaccess from interfering with these rules.
# 4. ServerAlias 52.64.159.85 allows the bare Elastic IP to reach this
#    vhost (without DNS pointing to the host yet).

<VirtualHost *:80>
    ServerName xevera-portal.duckdns.org
    ServerAlias 52.64.159.85
    DocumentRoot /var/www/xevera/frontend/dist

    # Frontend static files
    <Directory /var/www/xevera/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # SPA fallback with first-match-wins pattern.
    # RewriteCond only attaches to the IMMEDIATELY following RewriteRule,
    # so each rule must carry its own conditions or use [S=] skip flags.
    RewriteEngine On

    # 1) Pass through /api/ requests to ProxyPassMatch/Alias below
    RewriteRule ^/api/ - [L]

    # 2) Pass through /uploads/ requests
    RewriteRule ^/uploads/ - [L]

    # 3) Serve existing files/dirs directly (assets, etc.)
    #    NOTE: In vhost context, %{REQUEST_FILENAME} is the URL path, not
    #    the filesystem path. Must use %{DOCUMENT_ROOT}%{REQUEST_URI}.
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f [OR]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
    RewriteRule ^ - [L]

    # 4) SPA fallback: serve index.html for everything else
    RewriteRule ^ /index.html [L]

    # Forward Authorization header to PHP-FPM
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # Backend API: use ProxyPassMatch to forward .php to PHP-FPM
    # This correctly maps the URL to the filesystem path
    ProxyPassMatch ^/api/(.*\.php)$ unix:/run/php-fpm/www.sock|fcgi://localhost/var/www/xevera/backend/api/$1

    # Serve non-PHP files from backend (e.g., .htaccess, static assets)
    Alias /api /var/www/xevera/backend/api
    <Directory /var/www/xevera/backend/api>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Static uploads
    Alias /uploads /var/www/xevera/backend/uploads
    <Directory /var/www/xevera/backend/uploads>
        Require all granted
    </Directory>

    ErrorLog /var/log/httpd/xevera-error.log
    CustomLog /var/log/httpd/xevera-access.log combined
</VirtualHost>
